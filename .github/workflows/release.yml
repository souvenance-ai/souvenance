# Release path (decision 21fd24c8, Q26): tag-driven — pushing tag vK.L.M runs
# the gate (typecheck + suite) then publishes @souvenance/cli to npm.
# The publish body lives in release-publish.yml (callable): the tag-on-bump
# path (release-tag.yml) shares it, because a GITHUB_TOKEN tag push cannot
# trigger this workflow (GitHub's anti-recursion rule). Credentials are
# TRUSTED PUBLISHING (OIDC): npm exchanges the GitHub OIDC claim for a
# short-lived publish grant (id-token: write below, one-time config in the
# npm org by Valentin, ticket 04). Each tag also drafts a GitHub release
# page. The version-bump gesture itself is automated by release-tag.yml +
# release-pr.yml (decision b6882bf2).
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # the release-page step
  id-token: write # OIDC trusted publishing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never race two publishes of the same ref

jobs:
  publish:
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ github.ref_name }}
