# Tag-on-bump leg (decision b6882bf2, spec release-automation): a version
# bump landing on main IS the release gesture — when package.json#version
# differs from the last v-tag (and neither the tag nor the registry carries
# that version yet), the tag is pushed here and the publish flow runs.
# Nothing else changes: gate, guard, OIDC and the install-path smoke stay
# the flow that ran green on 0.1.1. The bump proposal itself is generated by
# release-pr.yml; a manual bump (Valentin's own edit) rides the same leg.
name: release-tag
on:
  push:
    branches: [main]

permissions:
  contents: write # the tag push
  id-token: write # the publish job calls release-publish.yml (OIDC)

concurrency:
  group: release-tag
  cancel-in-progress: false # never race two tag decisions

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the compare
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Non-version tags exist (pre-genesis): match v* only. The registry
      # pre-check skips versions npm already carries (manual past publishes,
      # re-tags after a failed smoke) — npm publish cannot republish one and
      # the run must not paint itself red for history.
      - id: decide
        run: |
          pkg=$(node -p "require('./package.json').version")
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ "v$pkg" = "$last" ]; then
            echo "no bump staged: HEAD is $pkg, last tag $last"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$pkg" >/dev/null; then
            echo "tag v$pkg already exists locally"
            exit 0
          fi
          if npm view "@souvenance/cli@$pkg" version >/dev/null 2>&1; then
            echo "registry already has $pkg — skipping (republish would fail)"
            exit 0
          fi
          git tag "v$pkg"
          git push origin "v$pkg"
          echo "tag=v$pkg" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
