# The standing gate (decision 21fd24c8, Q26): every push and every PR runs
# typecheck + the full suite. It is both the merge-confidence signal and the
# model the release workflow re-runs before publishing (issues 01, .scratch/npm-publish).
name: tests
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
