# The publish body, callable (decision b6882bf2, spec release-automation):
# extracted verbatim from release.yml so the tag-on-bump path can invoke it
# directly — a GITHUB_TOKEN tag push cannot trigger release.yml's tag trigger
# (GitHub's anti-recursion rule), so both paths must call this via 'uses:'.
# Behavior is the flow that ran green on 0.1.1 (decision 21fd24c8): gate →
# guard → OIDC publish → install-path smoke → release page. Refactor is
# callability only, not behavior.
name: release-publish
on:
  workflow_call:
    inputs:
      tag:
        description: 'The tag to publish (e.g. v0.1.2); defaults to github.ref_name'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to publish (empty = current ref)'
        required: false
        default: ''

# Self-owned permissions: the two workflow callers (release.yml,
# release-tag.yml) declare theirs, but a direct workflow_dispatch has no
# caller — the lived catch of 2026-10-21 (npm EUSAGE: provenance needs
# id-token write). The callable now carries its own.
permissions:
  contents: write # the release-page step
  id-token: write # OIDC trusted publishing

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Check out the TAGGED tree — the publish must ship the exact tagged
      # state, not a branch tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      - run: yarn install --immutable

      # — the gate, identical to tests.yml —
      - run: yarn typecheck
      - run: yarn test

      # — guard: the tag names the version package.json will publish —
      #   the version lives in the committed package.json; bump-then-tag
      #   is the release gesture.
      - name: guard — tag equals package.json version
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${TAG#v}"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $TAG does not match package.json version $pkg" >&2
            echo "bump package.json#version, commit on main, re-tag" >&2
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm
      # drifts, so upgrade explicitly instead of hoping.
      - name: upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: publish to npm (OIDC — no token secret)
        run: npm publish --access public --provenance

      # — directive 5de23653: 'published' is claimed ONLY from an install path —
      #   repo gates are necessary, never sufficient. The registry CDN can lag
      #   a couple of minutes behind a fresh publish (observed on 0.1.0's
      #   first smoke), so poll this TAG'S version before the npx probe.
      - name: install-path smoke (pinned to this tag)
        run: |
          ver="${TAG#v}"
          ok=""
          for i in $(seq 1 18); do
            if npm view "@souvenance/cli@$ver" version >/dev/null 2>&1; then
              echo "manifest visible (tentative $i)"
              ok="yes"
              break
            fi
            echo "propagation registry... ($i/18)"
            sleep 10
          done
          if [ -z "$ok" ]; then
            echo "manifest @$ver invisible après 3 min — publish présent mais smoke en échec" >&2
            exit 1
          fi
          cd "$(mktemp -d)"
          npx --yes "@souvenance/cli@$ver" --help

      - name: draft the release page
        run: gh release create "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
